<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>Przepis na cynamonki</title>
    </head>
    <body>
        <main>
            <h2>Przepis na puszyste i pyszne cynamonki, idealne na długie jesienne wieczory</h2>
        </main>
            <section>
                <h1>Składniki</h1>
                <ul>
                    <li>500g mąki pszennej</li>
                    <li>10g drożdży instant</li>
                    <li>2 żółtka</li>
                    <li>1 całe jajko</li>
                    <li>80g cukru białego</li>
                    <li>ok.210g letniego masła</li>
                    <li>15g cynamonu</li>
                    <li>50g cukru trzcinowego</li>
                    <li>50ml śmietanki kremóki 30%</li>
                </ul>
            </section>
    </body>
</html>
